[workspace]
members = ["packaging"]

[package]
name = "polish-geodata"
version = "0.1.0"
edition = "2021"
description = "Polish geodata for RustGIS: GUGiK overlays, WFS downloads and parcel lookup"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.37"
# native-certs: trust the OS store, so corporate/AV TLS interception and proxy CAs work.
# webpki-roots alone rejects them, and GUGiK traffic then fails behind such a proxy.
ureq = { version = "2.12", features = ["gzip", "native-certs"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
