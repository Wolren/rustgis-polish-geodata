[package]
name = "dane-pl"
version = "0.1.0"
edition = "2021"
description = "Polish geodetic data for RustGIS: GUGiK overlays, WFS downloads and parcel lookup"
license = "MIT"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
quick-xml = "0.37"
ureq = { version = "2.12", features = ["gzip"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
