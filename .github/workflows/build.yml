name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests
        run: cargo test

      - name: Manifest is current
        run: python tools/manifest.py --check

      - name: READMEs name real commands
        run: python tools/readme_check.py

      - name: Packager builds
        run: cargo build --release -p package
