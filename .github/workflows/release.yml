name: Release

# One tag makes one package: the three platform binaries are built on their own runners, then a
# single archive is assembled on Linux, so the manifest's run map names files that are inside it.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  binary:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            built: polish-geodata.exe
            shipped: polish-geodata.exe
          - os: ubuntu-latest
            built: polish-geodata
            shipped: polish-geodata-linux
          - os: macos-latest
            built: polish-geodata
            shipped: polish-geodata-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the plugin
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.shipped }}
          path: target/release/${{ matrix.built }}
          if-no-files-found: error

  package:
    needs: binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Stage the three binaries where the packager looks
        run: |
          mkdir -p dist/bin
          cp artifacts/polish-geodata.exe/polish-geodata.exe dist/bin/
          cp artifacts/polish-geodata-linux/polish-geodata dist/bin/polish-geodata-linux
          cp artifacts/polish-geodata-macos/polish-geodata dist/bin/polish-geodata-macos
          chmod +x dist/bin/polish-geodata-linux dist/bin/polish-geodata-macos
          ls -l dist/bin

      - name: Assemble the package
        run: cargo run --release -p package

      - name: Read the version
        id: version
        run: |
          VERSION=$(python -c "import json;print(json.load(open('plugin.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/polish-geodata-${{ steps.version.outputs.version }}.rgplugin
            dist/polish-geodata.json
          generate_release_notes: true
